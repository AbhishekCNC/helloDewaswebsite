<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="navNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B223D" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
  </defs>

  <!-- Square navy background with 22px rounded corners -->
  <rect width="128" height="128" rx="22" fill="url(#navNavy)" />
  <rect x="1" y="1" width="126" height="126" rx="21" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2" />

  <!-- Authentic Hello Dewas Logo with 18% safe padding (x=16, y=16, width=96, height=96) -->
  <image href="data:image/png;base64," x="16" y="16" width="96" height="96" preserveAspectRatio="xMidYMid meet" />
</svg>
